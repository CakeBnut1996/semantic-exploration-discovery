# --- GLOBAL SETTINGS ---
data:
  data_to_db: "data_raw" # Path to local raw data directory (adjust if connecting directly to a database)
  db_path: "chroma_db" # Path to local vector database where embeddings are saved (adjust if using a remote database)
  chunk_size: 256 # the size of each data chunk when processing the raw data
  chunk_overlap: 40 # the number of overlapping tokens between consecutive chunks

retrieval:
  num_docs: 5 # number of documents to retrieve
  active_db: "demo" 
  active_embedding: "mini_lm"

generation:
  active_student: "groq_gpt_oss"

llm:
  groq_gpt_oss:
    provider: "groq"
    model: "openai/gpt-oss-120b" # Free tier on Groq

embeddings:
  mini_lm:
    model: "sentence-transformers/all-MiniLM-L6-v2"

db:
  demo:
    collection: "kdf-demo"
